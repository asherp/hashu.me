[package]
name = "hashu-glossia"
version = "0.1.0"
edition = "2021"
publish = false
description = "Glossia's Cashu word encoding for the hashu.me wallet (WebAssembly)"
license = "MIT"

# Built with ./build.sh into src/js/glossia/ (checked in, so the wallet
# build needs no Rust toolchain).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
glossia = { version = "0.7", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
